<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Break System</title>
    <link rel="stylesheet" href="user.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>
<body>
    <header>
        <div class="logo">
             <img src="https://oppty.in/wp-content/uploads/2025/07/oppty.png"alt="logo">
        </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
<div>
    <h2>User Dashboard</h2></div>
<div><button onclick="logout()" class="logout">Logout</button></div>
</div>
</header>
<main>
<div class="container">
    <aside class="sidebar">
       <img id="profilePic" src="https://i.pinimg.com/736x/a3/31/a8/a331a8d0a8ff50827c6cb3437f336a30.jpg" alt="Profile" class="image" />
       <p id="welcome"></p>
      <ul class="menu">
        <li> <i class="fa-solid fa-chart-line"></i><p>Career</p></li>
        <li onclick="contact()">  <i class="fa-solid fa-phone"></i> <p>Contact</p></li>
        <li> <i class="fa-solid fa-info-circle"></i><p>About</p></li>
         <li><i class="fa-solid fa-cog"></i><p>Settings</p></li>
      </ul>
    </aside>
  

<section>
<div class="card">
    <h3>Employees Overview</h3>
    <p id="stats"></p>
</div>

<div class="card">
    <h3>Break Management</h3>

    <select id="breakType">
        <option value="Regular">Regular Break</option>
        <option value="Lunch">Lunch Break (1 Hour)</option>
    </select>

    <div class="btn-group">
        <button class="start" onclick="startBreak()">Start Break</button>
        <button class="end" onclick="endBreak()">End Break</button>
    </div>

    <p id="timer"></p>
    <p id="breakStatus"></p>

</div>
<div>
    <p id="stats1"></p>

</div>
</section>
</div>
</main>
<footer>
    <p id="modile"></p>
    <p>&copy; 2025 Oppty Tech Hub. All rights reserved.</p>
    <div class="foot" style="text-align: center;"><a href="#"><i class="fa-brands fa-instagram"></i></a>
    <a href="#"><i class="fa-brands fa-twitter"></i></a>
<a href="#"><i class="fa-brands fa-facebook"></i></a></div>
</footer>
<script src="user.js"></script>
</body>
</html>
