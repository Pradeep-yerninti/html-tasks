<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE - Local E-Commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #6366f1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --red: #ef4444;
            --green: #10b981;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 1.5rem;
            --radius-lg: 2.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }

        /* Header Styles */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: #eff6ff;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            position: relative;
            padding: 0.6rem;
            border-radius: 50%;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #f1f5f9;
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--primary);
            color: white;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 0.2rem 0.4rem;
            border-radius: 999px;
            border: 2px solid white;
        }

        .badge.wishlist { background: var(--red); }

        /* Product Grid */
        main { padding: 2rem 0; }

        .view-title { margin-bottom: 2.5rem; }
        .view-title h2 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.025em; }
        .view-title p { color: var(--text-muted); font-size: 1.125rem; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .card-img-wrap {
            position: relative;
            height: 280px;
            overflow: hidden;
            background: #f1f5f9;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .card-img-wrap img { transform: scale(1.05); }

        .wish-overlay {
            position: absolute;
            top: 1rem;
            right: 1rem;
            transform: translateX(50px);
            opacity: 0;
            transition: all 0.3s;
        }

        .card:hover .wish-overlay { transform: translateX(0); opacity: 1; }

        .card-body { padding: 1.5rem; }
        .card-cat { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-bottom: 0.25rem; }
        .card-title { font-weight: 700; font-size: 1.125rem; margin-bottom: 1.5rem; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .card-price { font-size: 1.5rem; font-weight: 900; }

        .btn-add {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 1rem;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        .btn-add:hover { background: var(--primary); }

        /* Drawers & Modals */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active { opacity: 1; pointer-events: auto; }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 100%;
            max-width: 400px;
            background: white;
            z-index: 70;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-grow: 1;
            flex-direction: column;
            box-shadow: -10px 0 20px rgba(0,0,0,0.05);
        }

        .drawer.active { transform: translateX(0); }

        .drawer-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .drawer-footer { padding: 1.5rem; background: var(--bg); border-top: 1px solid var(--border); }

        .list-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 1rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .list-item:hover { border-color: var(--border); }
        .item-info { flex: 1; }
        .item-name { font-weight: 700; font-size: 0.875rem; }
        .item-price { color: var(--primary); font-weight: 900; font-size: 0.875rem; }

        /* Product Detail Modal */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }

        .modal.active { display: flex; }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            position: relative;
            animation: modalZoom 0.3s ease-out;
        }

        @keyframes modalZoom {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-img { width: 50%; background: #f1f5f9; }
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }
        .modal-body { width: 50%; padding: 2.5rem; display: flex; flex-direction: column; }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem;
            border-radius: 50%;
            background: white;
            border: 1px solid var(--border);
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        /* Admin Styles */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 2rem; border: 1px solid var(--border); display: flex; justify-content: space-between; }
        .stat-label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 2rem; font-weight: 900; margin-top: 0.5rem; }

        .admin-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .admin-box { background: white; border-radius: 2rem; border: 1px solid var(--border); overflow: hidden; }
        .admin-box-header { padding: 1.5rem; border-bottom: 1px solid var(--border); font-weight: 800; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 1rem 1.5rem; text-align: left; background: var(--bg); font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .modal-card { flex-direction: column; }
            .modal-img, .modal-body { width: 100%; }
            .modal-img { height: 250px; }
            .admin-layout { grid-template-columns: 1fr; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--text-main);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: var(--shadow-lg);
            transform: translateY(150%);
            transition: transform 0.3s;
            z-index: 200;
        }

        .toast.active { transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-content">
            <div class="logo" onclick="switchView('shop')">
                <i class="fa-solid fa-spider"></i> Venom
            </div>
            
            <div class="nav-links">
                <button onclick="switchView('shop')" id="btn-shop" class="nav-btn active">
                    <i data-lucide="store" size="18"></i> Shop
                </button>
                <button onclick="switchView('admin')" id="btn-admin" class="nav-btn">
                    <i data-lucide="layout-dashboard" size="18"></i> Dashboard
                </button>
            </div>

            <div class="header-actions">
                <button onclick="toggleDrawer('wishlist')" class="icon-btn">
                    <i data-lucide="heart" id="wish-icon-head"></i>
                    <span id="wish-badge" class="badge wishlist hidden">0</span>
                </button>
                <button onclick="toggleDrawer('cart')" class="icon-btn">
                    <i data-lucide="shopping-cart"></i>
                    <span id="cart-badge" class="badge hidden">0</span>
                </button>
                <button onclick="toggleModal('profile')" class="icon-btn" style="border: 1px solid var(--border)">
                    <i data-lucide="user"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Shop View -->
        <section id="shop-view">
            <div class="view-title">
                <h2 style="text-align: center;">New Arrivals</h2>
                
            </div>
            <div id="product-grid" class="product-grid"></div>
        </section>

        <!-- Admin View -->
        <section id="admin-view" class="hidden">
            <div class="view-title">
                <h2>Admin DashBoard</h2>
                
            </div>
            
            <div class="stats-grid" id="admin-stats"></div>

            <div class="admin-layout">
                <div class="admin-box">
                    <div class="admin-box-header">Activity Log</div>
                    <div style="max-height: 400px; overflow-y: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Action</th>
                                    <th style="text-align: right;">Time</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body"></tbody>
                        </table>
                    </div>
                </div>
                <div class="admin-box">
                    <div class="admin-box-header">Wishlist Trends</div>
                    <div id="wish-trends" style="padding: 1.5rem;"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- UI Components (Drawers/Modals) -->
    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="drawer-wishlist" class="drawer">
        <div class="drawer-header">
            <h3 style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="heart" style="color: var(--red);"></i> Wishlist</h3>
            <button onclick="closeAll()" class="icon-btn"><i data-lucide="x"></i></button>
        </div>
        <div id="wish-list-content" class="drawer-content"></div>
        <div class="drawer-footer">
            <button onclick="clearList('wishlist')" style="width: 100%; border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer;">Clear Wishlist</button>
        </div>
    </div>

    <div id="drawer-cart" class="drawer">
        <div class="drawer-header">
            <h3 style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="shopping-bag" style="color: var(--primary);"></i> Cart</h3>
            <button onclick="closeAll()" class="icon-btn"><i data-lucide="x"></i></button>
        </div>
        <div id="cart-list-content" class="drawer-content"></div>
        <div class="drawer-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                <span style="color: var(--text-muted); font-weight: 600;">Subtotal</span>
                <span id="cart-total" style="font-weight: 900; font-size: 1.5rem;">$0</span>
            </div>
            <button style="width: 100%; padding: 1.25rem; border-radius: 1.25rem; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer;">Checkout</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-details" class="modal">
        <div class="modal-card">
            <button onclick="closeAll()" class="modal-close"><i data-lucide="x"></i></button>
            <div class="modal-img">
                <img id="detail-img" src="" alt="">
            </div>
            <div class="modal-body">
                <span id="detail-cat" class="card-cat"></span>
                <h3 id="detail-name" style="font-size: 2rem; font-weight: 800; margin-bottom: 1rem;"></h3>
                <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">Premium design meets functional excellence. This collection features sustainable materials and ergonomic shapes to fit your lifestyle perfectly.</p>
                
                <div style="margin-top: auto;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
                        <span id="detail-price" style="font-size: 2.5rem; font-weight: 900;"></span>
                        <button id="modal-wish-btn" class="icon-btn" style="border: 1px solid var(--border); padding: 1rem; border-radius: 1.25rem;"><i data-lucide="heart"></i></button>
                    </div>
                    <button id="modal-cart-btn" class="btn-add" style="width: 100%; padding: 1.25rem; font-size: 1rem; justify-content: center;">
                        <i data-lucide="plus"></i> Add to Cart
                    </button>
                    <button onclick="closeAll()" style="width: 100%; margin-top: 1rem; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer;">Back to Catalog</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-profile" class="modal">
        <div class="modal-card" style="max-width: 350px; flex-direction: column;">
            <div style="background: var(--primary); padding: 3rem 2rem; text-align: center; color: white;">
                <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center;">
                    <i data-lucide="user" size="40"></i>
                </div>
                <h3 style="font-weight: 800;">Local Guest</h3>
                <p id="profile-uid" style="font-size: 0.6rem; opacity: 0.7; font-family: monospace;"></p>
            </div>
            <div style="padding: 2rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div style="background: var(--bg); padding: 1rem; border-radius: 1.5rem; text-align: center;">
                        <div style="font-size: 0.6rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Cart</div>
                        <div id="prof-cart-count" style="font-size: 1.5rem; font-weight: 900; color: var(--primary);">0</div>
                    </div>
                    <div style="background: var(--bg); padding: 1rem; border-radius: 1.5rem; text-align: center;">
                        <div style="font-size: 0.6rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Saved</div>
                        <div id="prof-wish-count" style="font-size: 1.5rem; font-weight: 900; color: var(--red);">0</div>
                    </div>
                </div>
                <button onclick="resetApp()" style="width: 100%; padding: 1rem; border-radius: 1rem; border: none; background: #fee2e2; color: #ef4444; font-weight: 800; cursor: pointer;">Reset Session</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <i data-lucide="check-circle" style="color: var(--green);"></i>
        <span id="toast-msg">Success!</span>
    </div>

    <script>
        // --- Data ---
        const PRODUCTS = [
            { id: 1, name: "Pro Wireless ANC", price: 299, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80", cat: "Electronics" },
            { id: 2, name: "Chronos Leather", price: 159, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80", cat: "Accessories" },
            { id: 3, name: "FitPulse V3", price: 89, image: "https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=500&q=80", cat: "Fitness" },
            { id: 4, name: "Voyager Pack", price: 120, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80", cat: "Travel" },
            { id: 5, name: "Zen Office Chair", price: 450, image: "https://m.media-amazon.com/images/I/518rAfZ8YQS._SX679_.jpg", cat: "Furniture" },
            { id: 6, name: "Aura Speaker", price: 135, image: "https://m.media-amazon.com/images/I/61c+1HU7ufL._AC_UY327_FMwebp_QL65_.jpg", cat: "Electronics" },
            { id: 7, name: "Minimalist Desk Lamp", price: 45, image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500&q=80", cat: "Home" },
            { id: 8, name: "Ultra-Wide Monitor", price: 599, image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=500&q=80", cat: "Electronics" },
            { id: 9, name: "Ceramic Coffee Set", price: 65, image: "https://m.media-amazon.com/images/I/41+DjknrA+L._SX342_SY445_QL70_FMwebp_.jpg", cat: "Home" },
            { id: 10, name: "Mechanical Keyboard", price: 180, image: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500&q=80", cat: "Electronics" },
            { id: 11, name: "Velvet Accent Pillow", price: 35, image: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=500&q=80", cat: "Home" },
            { id: 12, name: "Duffel Gym Bag", price: 75, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80", cat: "Fitness" },
            { id: 13, name: "Smart Table Lamp", price: 110, image: "https://images.unsplash.com/photo-1534073828943-f801091bb18c?w=500&q=80", cat: "Electronics" },
            { id: 14, name: "Leather Journal", price: 40, image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&q=80", cat: "Accessories" },
            { id: 15, name: "Matte Black Kettle", price: 95, image: "https://m.media-amazon.com/images/I/41hL1A6r0AL._SY300_SX300_QL70_FMwebp_.jpg", cat: "Home" },
            { id: 16, name: "Performance Yoga Mat", price: 55, image: "https://images.unsplash.com/photo-1592432678016-e910b452f9a2?w=500&q=80", cat: "Fitness" },
        ];

        // --- State ---
        let state = {
            cart: [],
            wishlist: [],
            activities: [],
            userId: ''
        };

        const STORAGE_KEY = 'luxe_vanilla_data';

        // --- Core Functions ---
        const init = () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = JSON.parse(saved);
            } else {
                state.userId = 'UX-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                save();
            }
            document.getElementById('profile-uid').innerText = state.userId;
            renderProducts();
            updateUI();
            lucide.createIcons();
        };

        const save = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateUI();
        };

        const updateUI = () => {
            // Badges
            const wB = document.getElementById('wish-badge');
            const cB = document.getElementById('cart-badge');
            
            wB.innerText = state.wishlist.length;
            wB.classList.toggle('hidden', state.wishlist.length === 0);
            
            cB.innerText = state.cart.length;
            cB.classList.toggle('hidden', state.cart.length === 0);

            // Icon State
            document.getElementById('wish-icon-head').style.color = state.wishlist.length > 0 ? 'var(--red)' : '';
            document.getElementById('wish-icon-head').style.fill = state.wishlist.length > 0 ? 'var(--red)' : 'transparent';

            // Profile
            document.getElementById('prof-cart-count').innerText = state.cart.length;
            document.getElementById('prof-wish-count').innerText = state.wishlist.length;

            // Content
            renderList('cart');
            renderList('wishlist');
            
            const total = state.cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cart-total').innerText = `$${total}`;

            if (!document.getElementById('admin-view').classList.contains('hidden')) {
                renderAdmin();
            }
        };

        // --- Navigation ---
        window.switchView = (view) => {
            document.getElementById('shop-view').classList.toggle('hidden', view !== 'shop');
            document.getElementById('admin-view').classList.toggle('hidden', view !== 'admin');
            document.getElementById('btn-shop').classList.toggle('active', view === 'shop');
            document.getElementById('btn-admin').classList.toggle('active', view === 'admin');
            if (view === 'admin') renderAdmin();
        };

        window.toggleDrawer = (type) => {
            closeAll();
            document.getElementById(`drawer-${type}`).classList.add('active');
            document.getElementById('overlay').classList.add('active');
        };

        window.toggleModal = (id) => {
            closeAll();
            document.getElementById(`modal-${id}`).classList.add('active');
        };

        window.closeAll = () => {
            document.querySelectorAll('.drawer, .modal, .overlay').forEach(el => el.classList.remove('active'));
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        };

        // --- Logic ---
        window.addTo = (id, list) => {
            const p = PRODUCTS.find(x => x.id === id);
            if (!p) return;

            state.activities.unshift({
                name: p.name,
                type: list,
                time: new Date().toISOString()
            });

            const entry = { ...p, instanceId: Date.now() + Math.random() };
            if (list === 'cart') {
                state.cart.push(entry);
            } else {
                if (state.wishlist.some(x => x.id === id)) return showToast("Already Wishlisted!");
                state.wishlist.push(entry);
            }
            save();
            showToast(`Added to ${list}!`);
        };

        window.removeItem = (instId, list) => {
            state[list] = state[list].filter(x => x.instanceId !== instId);
            save();
        };

        window.clearList = (list) => {
            state[list] = [];
            save();
        };

        window.showDetails = (id) => {
            const p = PRODUCTS.find(x => x.id === id);
            document.getElementById('detail-img').src = p.image;
            document.getElementById('detail-name').innerText = p.name;
            document.getElementById('detail-cat').innerText = p.cat;
            document.getElementById('detail-price').innerText = `$${p.price}`;
            
            document.getElementById('modal-wish-btn').onclick = () => addTo(p.id, 'wishlist');
            document.getElementById('modal-cart-btn').onclick = () => { addTo(p.id, 'cart'); closeAll(); };
            
            toggleModal('details');
            lucide.createIcons();
        };

        window.resetApp = () => {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        };

        // --- Rendering ---
        const renderProducts = () => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = PRODUCTS.map(p => `
                <div class="card" onclick="showDetails(${p.id})">
                    <div class="card-img-wrap">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="wish-overlay">
                            <button class="icon-btn" style="background:white; box-shadow:var(--shadow)" onclick="event.stopPropagation(); addTo(${p.id}, 'wishlist')">
                                <i data-lucide="heart" size="18"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-cat">${p.cat}</div>
                        <div class="card-title">${p.name}</div>
                        <div class="card-footer">
                            <div class="card-price">$${p.price}</div>
                            <button class="btn-add" onclick="event.stopPropagation(); addTo(${p.id}, 'cart')">
                                <i data-lucide="plus"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const renderList = (type) => {
            const cont = document.getElementById(`${type === 'cart' ? 'cart' : 'wish'}-list-content`);
            const items = state[type];
            if (items.length === 0) {
                cont.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:2rem;"><i data-lucide="package" size="40" style="margin-bottom:1rem; opacity:0.3"></i><p>Empty</p></div>`;
            } else {
                cont.innerHTML = items.map(i => `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-name">${i.productName || i.name}</div>
                            <div class="item-price">$${i.price}</div>
                        </div>
                        <button onclick="removeItem(${i.instanceId}, '${type}')" class="icon-btn" style="color:var(--text-muted)"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        };

        const renderAdmin = () => {
            const totalVal = state.cart.reduce((s, i) => s + i.price, 0);
            const grid = document.getElementById('admin-stats');
            grid.innerHTML = `
                ${renderStat('Rev. Potential', `$${totalVal}`, 'trending-up', 'var(--primary)', '#eff6ff')}
                ${renderStat('Cart Load', state.cart.length, 'shopping-cart', 'var(--primary)', '#eff6ff')}
                ${renderStat('Saved items', state.wishlist.length, 'heart', 'var(--red)', '#fff1f2')}
                ${renderStat('Events', state.activities.length, 'zap', 'orange', '#fff7ed')}
            `;

            const table = document.getElementById('admin-table-body');
            table.innerHTML = state.activities.slice(0, 15).map(a => `
                <tr>
                    <td><div style="font-weight:700">${a.name}</div></td>
                    <td><span style="font-size:0.7rem; font-weight:800; background:${a.type === 'cart' ? '#dbeafe':'#ffe4e6'}; color:${a.type === 'cart' ? '#1e40af':'#9f1239'}; padding:0.2rem 0.5rem; border-radius:0.5rem; text-transform:uppercase;">${a.type}</span></td>
                    <td style="text-align:right; color:var(--text-muted); font-size:0.75rem;">${new Date(a.time).toLocaleTimeString()}</td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--text-muted)">No data</td></tr>';

            const trends = document.getElementById('wish-trends');
            const counts = state.activities.filter(a => a.type === 'wishlist').reduce((acc, curr) => {
                acc[curr.name] = (acc[curr.name] || 0) + 1;
                return acc;
            }, {});
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            trends.innerHTML = sorted.map(([name, count]) => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; padding:1rem; background:var(--bg); border-radius:1rem;">
                    <span style="font-weight:700; font-size:0.875rem;">${name}</span>
                    <span style="background:white; padding:0.2rem 0.6rem; border-radius:0.5rem; font-weight:900; color:var(--primary); font-size:0.75rem; border:1px solid var(--border)">${count}</span>
                </div>
            `).join('') || '<p style="text-align:center; color:var(--text-muted); font-style:italic">No wish trends</p>';

            lucide.createIcons();
        };

        const renderStat = (lbl, val, icon, color, bg) => `
            <div class="stat-card">
                <div>
                    <div class="stat-label">${lbl}</div>
                    <div class="stat-value">${val}</div>
                </div>
                <div style="background:${bg}; color:${color}; padding:0.75rem; border-radius:1rem; height:fit-content;">
                    <i data-lucide="${icon}"></i>
                </div>
            </div>
        `;

        // Start
        init();
    </script>
</body>
</html>
